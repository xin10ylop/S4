# Polymarket BTC Up/Down bot configuration.
# Secrets (private keys, API creds) are NEVER placed here — see .env / environment variables.
# This file is safe to commit.

mode:
  # PAPER is the safety default. Real orders require BOTH paper: false here AND
  # POLYBOT_LIVE=1 in the environment AND a private key present. See execution.py.
  paper: true

# HTTP endpoints (validated against the live APIs; see docs in README).
endpoints:
  gamma_base: "https://gamma-api.polymarket.com"
  clob_base: "https://clob.polymarket.com"
  clob_ws: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  binance_rest_base: "https://data-api.binance.vision"   # portable everywhere (api.binance.com is geo-blocked in some sandboxes)
  binance_ws_base: "wss://stream.binance.com:9443"        # optional, off by default

# TLS: cafile resolved at runtime from POLYBOT_CA_BUNDLE env var if set, else
# /root/.ccr/ca-bundle.crt if that file exists (dev sandbox), else system default (real server).

fees:
  fee_rate: 0.07   # taker fee = fee_rate * p * (1-p) per share; maker = 0

# Chainlink BTC/USD Data Streams — the ACTUAL resolution source for 5m/15m/4h.
# All endpoints below are public and unauthenticated: there is no key, no
# contract and NO SECRET in this file. Chainlink's own Data Streams API is
# commercially gated and is NOT used; Polymarket rebroadcasts the identical
# signed report for free (verified bit-exact, 266/266 seconds — audit/A1_chainlink.md).
# If you ever point this at a credentialled endpoint, put the URL in the env
# var named by `onchain_check.rpc_url_env` — never in this file.
oracles:
  chainlink:
    rtds_ws: "wss://ws-live-data.polymarket.com"
    topic: "crypto_prices_chainlink"
    symbol: "btc/usd"
    feed_id: "0x00039d9e45394f473ab1f050a1b963e6b05351e52d71e507509ada0c95ed75b8"  # mainnet BTC/USD Data Stream
    max_staleness_secs: 4.0    # p99 publish lag is 2.0s; beyond this latest() returns None and the bot skips
    max_gap_secs: 5            # strike/settle = first print at-or-after the boundary, searched this far
    lookback_secs: 30          # how far back price_at_or_before() will forward-fill
    buffer_secs: 20000         # ~5.5h of 1s prints, > one 4h window
    ping_interval_secs: 5.0    # RTDS keepalive cadence (documented)
    recv_timeout_secs: 15.0
    # A1 §2e measured Chainlink-anchor + Binance-drift-over-the-publish-lag at
    # 97.12% vs 96.75% sign accuracy at k=1s on 5m. OFF for the first paper run
    # so the pure Chainlink signal is validated on its own first.
    hybrid_binance_drift: false
    standby:
      enabled: true            # GMX republishes the SIGNED Data Streams report (independent operator)
      url: "https://arbitrum-api.gmxinfra.io/signed_prices/latest"
      backup_url: "https://arbitrum-api.gmxinfra2.io/signed_prices/latest"
      idle_poll_secs: 30.0     # while RTDS is healthy this is only an integrity cross-check
      active_poll_secs: 0.5    # accelerates to real failover cadence when RTDS goes stale
    onchain_check:
      enabled: false           # LIVENESS ONLY — 33.8s cadence, never a signal. Off by default.
      rpc_url: "https://polygon-bor-rpc.publicnode.com"
      rpc_url_env: "POLYBOT_CHAINLINK_RPC_URL"   # set this to override with a keyed RPC (secret stays in env)
      feed_address: "0xc907e116054Ad103354f2D350FD2514433D57F6f"
      poll_secs: 60

families:
  1h:
    enabled: true
    duration_secs: 3600
    oracle: binance          # 1h resolves on Binance BTC/USDT 1H candle
    close_snipe: true        # PRIMARY strategy — default ON for 1h only
    # OFF as of A4: 10 days live produced 1,235 signals and 1,235 empty_book —
    # ZERO fills. The post-close book is bulk-cancelled and does not repopulate
    # (docs/05_clob_api_spec.md), so this is pure logging + ~5 wasted REST book
    # fetches per hourly close. `empty_streak_stop: 5` was already capping it at
    # 5 attempts/market (1,235 / 238 closes = 5.2), i.e. the guard worked and the
    # strategy still has no edge to guard. Do NOT re-enable without evidence the
    # book survives the close.
    settle_sweep: false
  # settle_sweep for the Chainlink families is OFF after live paper evidence
  # (2026-07-15, first 4.5h of deployment): 358 sweep attempts -> the only 3
  # fills were ALL Binance-vs-Chainlink disagreement cases and ALL lost
  # (adverse selection: the only cheap "winner" asks left standing are the
  # ones the Chainlink-watching market knows are actually losers). Do NOT
  # re-enable without a real Chainlink oracle wired in oracle.py.
  # The Chainlink oracle IS now wired (oracle.ChainlinkOracle, B2). The flags
  # below stay OFF on purpose: wiring the feed and enabling trading are
  # separate steps. Turn-on procedure + the sigma_1s_floor recalibration that
  # MUST happen first are documented in audit/B2_impl_chainlink.md.
  # The engine only constructs/starts the Chainlink oracle when one of these
  # families has close_snipe or settle_sweep true, so leaving them false keeps
  # the running 1h bot byte-for-byte unchanged.
  15m:
    enabled: true
    duration_secs: 900
    oracle: chainlink        # 15m resolves on the Chainlink BTC/USD Data Stream
    close_snipe: false       # OFF pending paper validation — see audit/B2_impl_chainlink.md
    settle_sweep: false
  5m:
    enabled: true
    duration_secs: 300
    oracle: chainlink
    close_snipe: false
    settle_sweep: false
  4h:
    enabled: true
    duration_secs: 14400
    oracle: chainlink
    close_snipe: false
    settle_sweep: false

strategy:
  close_snipe:
    # Snipe window is tau in [tau_lo, snipe_last_secs], where
    #   tau_lo = max(snipe_min_tau_secs, latency_ms/1000 + snipe_fill_margin_secs).
    # Measured on 1,738 OOS 1h closes — see audit/A4_change_spec.md Part 1.
    snipe_last_secs: 5           # was 6. Upper tau bound: how EARLY we may fire.
                                 # tau=6 signals carry 6s of unresolved BTC risk against a
                                 # `fair` frozen at signal time; at a $250 clip every large
                                 # loss came from there (worst single trade -$258.75).
    # Hard allowlist enforced in engine._maybe_snipe, independent of the per-family
    # `close_snipe` booleans above. Restores the guard deleted in the tau-band
    # refactor (docs/07_scale_audit.md item 4): a family must be BOTH enabled above
    # AND listed here. 5m/15m/4h are deliberately absent — the verifier measured
    # corrected 5m at +0.87c (t=0.22) at these shipped parameters, i.e. -$58/day at
    # the $250 clip. Do not add one without re-running the go/no-go in docs/07 sec.6.
    allowed_families: ["1h"]
    snipe_min_tau_secs: 2.5      # was 2.0. The bound must also cover the two blocking
                                 # /book fetches between the gate and the fill worker
                                 # (measured delta_book: median 0.315s, cold 0.791s).
                                 # At 2.0 the real fill margin was +0.19s median and
                                 # NEGATIVE on a cold connection — i.e. orders landing
                                 # at/after the close. docs/07_scale_audit.md item 3.
    snipe_fill_margin_secs: 0.5  # NEW. Required slack between order arrival and the close.
                                 # tau=1 signals filled 0/46 times (42 hit an empty book);
                                 # in LIVE that is a real order sent into a closed market.
    edge_min: 0.03            # was 0.05. fair - ask - fee(ask) must exceed this.
                              # +22% fills / +11% P&L in the [2,5] window (A4 Part 2 ii).
                              # Also the per-level cutoff for the fill walk; still bounded
                              # by execution.max_walk_above_best — do NOT add a second knob.
    price_min: 0.30           # only take asks in (price_min, price_max)
    price_max: 0.99
    vol_window_secs: 120      # rolling window for 1s log-return std
    sigma_1s_floor: 8.0e-06   # vol floor: quiet/stale polling underestimates vol -> false certainty
    fair_cap: 0.98            # model certainty saturates here; a Gaussian on polled 1s data
                              # cannot distinguish 99% from 99.9999% (fat-tail protection)

    # ---------------- M4 GUARD 1: ADVERSE-SIZE FILTER (default OFF) ----------
    # Caps or skips an ask level whose size is anomalous relative to that
    # family's own recent typical depth:
    #     size_ratio = level.size / median(last `history_n` in-band ask sizes)
    # "in-band" = only levels inside (price_min, price_max) are recorded, which
    # matters enormously: median best-ask size by price bucket on 275 days of 1h
    # quotes is 24,190 at (0,0.1] but 10.6 at (0.5,0.7], so a reference pooled
    # over all prices is dominated by free lottery tickets and is meaningless.
    #
    # DEFAULT OFF ON MEASURED EVIDENCE, not on convenience. Replaying shipped
    # close_snipe over 6,523 1h closes (236 fills, 119 days) found the OPPOSITE
    # of adverse selection:
    #   levels > 5x the family median: 44 fills, 44/44 won, +38.1c/share
    #   normal levels:                189 fills, 175/189 won (92.6%), +22.4c/share
    #   at every threshold >=3x, all 14 losing trades came from NORMAL-sized
    #     levels (worst LARGE trade +$14.91); at the loosest 2x cut exactly one
    #     loser (ratio 2.06) falls on the LARGE side
    #   OLS pnl ~ log10(size_ratio) + price: size coef +0.051 (t=+2.87) — bigger
    #     is BETTER even after controlling for price; reproduced on an
    #     independent 359-trade wider sample (coef +0.051, t=+2.58).
    # Turning it on at 5x would have discarded 69% of realized PnL (skip mode)
    # or 15% (cap mode) to prevent a loss that never occurred.
    #
    # NOT UNANIMOUS, and the dissent is recorded rather than buried: of the
    # three reference definitions tested, the market's OWN trailing-300s depth
    # gives -10.6c/share (p=0.035, n=19) at its loosest 2x cut. Those trades are
    # still +15.6c/share PROFITABLE — a dilution, not adverse selection — that
    # cell is 1 of 15 tested, and the effect vanishes as the threshold tightens
    # (p=0.26 at 3x, p=0.90 at 5x). See audit/M4_risk_guards.md §1.2b for the
    # full argument. Neither reading justifies defaulting this ON.
    #
    # Re-run that measurement per coin before enabling for a new family — the
    # mechanism (an informed seller) is real in principle, it simply is not what
    # a big offer means on the 1h BTC book.
    adverse_size:
      enabled: false          # measured: no adverse effect on 1h BTC. Do not flip on vibes.
      mode: "cap"             # "cap" = take at most the ceiling from that level and keep
                              # walking; "skip" = take nothing from it and keep walking.
                              # Neither can re-baseline max_walk_above_best.
      max_size_ratio: 8.0     # a level is anomalous above this multiple of the reference.
                              # Measured ratio distribution on the 233 shipped-parameter
                              # fills that had a reference: p50 0.80x, p75 3.4x, p90 11.9x.
                              # 8x would have bound on 12.4% of taken levels (29/233).
      history_n: 200          # rolling window of in-band level observations per family
      min_samples: 30         # below this the reference is meaningless and the filter is
                              # INERT (logged in status.json guards.depth_reference).
                              # Samples come only from books the bot already fetches inside
                              # the snipe window, so this costs no extra REST traffic — but
                              # it also means a fresh deployment takes ~3-4 days of closes
                              # to accumulate 30 in-band observations for one coin.

    # ---------------- M4 GUARD 2: WARMUP AFTER RESTART (default ON) ----------
    # sigma_1s is the std of 1s log returns over the trailing vol_window_secs.
    # After a restart (deploy, watchdog, OOM, crash) that buffer is nearly
    # empty and BinanceOracle.rolling_log_return_std will answer from as few as
    # TWO returns. A too-small sigma inflates |z| and pushes `fair` toward
    # fair_cap — the mechanism behind this project's first -$25 loss.
    #
    # THRESHOLD DERIVED FROM DATA (19,569 evaluation ticks over 6,523 1h closes,
    # audit/M4_risk_guards.md §2). Fraction of signals that exist ONLY because
    # sigma was cold, and what those extra trades earn vs the warm tape
    # (243 warm trades, 93.4% win, +25.0c/share):
    #     n=3   +25.5% extra signals   +9.2c/share   (-15.8c vs warm, p<0.001)
    #     n=45   +6.2% extra signals   -3.8c/share   (-28.8c vs warm, p<0.001)
    #     n=60   +3.3% extra signals   +1.2c/share   (-23.8c vs warm, p<0.001)
    #     n=90   +2.5% extra signals  +13.0c/share   (-12.0c vs warm, p=0.002)
    # Cold-sigma trades are worse at EVERY n; contamination falls monotonically.
    # The cost of waiting is ~zero: at 0.88 trades/day a 120s lockout forgoes
    # 0.0012 trades per restart, so the threshold is set by robustness, not by
    # opportunity cost.
    warmup:
      enabled: true
      min_oracle_samples: 60  # samples inside the trailing vol_window_secs (120s).
                              # NOT 90/120: the oracle loop polls at
                              # (1.0s wait + fetch latency), so a slow link yields
                              # ~85-105 samples per 120s and a 90+ threshold could
                              # block trading FOREVER — a worse failure than the one
                              # being guarded. 60 tolerates a 2.0s effective poll
                              # period and still cuts cold contamination 25.5% -> 3.3%.
      min_uptime_secs: 120    # one full vol window of wall clock, independent of the
                              # sample count (a burst of duplicate polls after a network
                              # stall can satisfy a count but not a clock). Also
                              # guarantees a discovery pass has completed.
      log_every_secs: 15      # a bot that is silently refusing to trade is
                              # indistinguishable from a bot with no signals.
  settle_sweep:
    settle_delay_secs: 2      # wait after close before sweeping (oracle/print publish lag)
    settle_window_secs: 120   # stop sweeping after this many seconds post-close
    settle_edge_min: 0.02     # 1 - price - fee(price) must exceed this
    price_max: 0.99
    distance_guard_usd: 3.0   # for families without a true Chainlink oracle: skip closes closer than this
    empty_streak_stop: 5      # stop re-sweeping a market after N consecutive empty-book attempts (book was bulk-cancelled)
    cap_usd: 25               # settle_sweep's OWN per-event clip. sizing.per_event_cap_usd was
                              # raised to $250 on close_snipe evidence only; settle_sweep has
                              # never filled and must not inherit that if it is re-enabled.

sizing:
  # $25 -> $250 measured at ~5x P&L on 1,738 OOS closes (docs/06 sec.4; independently
  # reproduced in audit/A4_change_spec.md Part 1c). REQUIRES the [2.0, 5.0] snipe window
  # from change (i): in the old (0, 6] window the same cap produces a -$258.75 worst trade
  # and P&L that PEAKS at $250 then falls ($473 at $500, $28 at $1000).
  # PAPER-only for now: docs/06 sec.8 sets the live go/no-go at ~20 resolved trades and
  # $25-50 to start. Do NOT carry $250 into LIVE on the strength of the backtest alone.
  per_event_cap_usd: 250
  # `_would_exceed_global_cap` is a "stop opening new positions" gate evaluated BEFORE the
  # new trade is sized (engine.py uses `>=` on current open notional), so the true ceiling
  # is max_open_notional + per_event_cap_usd = $1250. 1h positions resolve within ~1-2 min
  # of close via the gamma poll, so real concurrency is ~1; $1000 is ~4 clips of headroom
  # and leaves room for a second family later.
  max_open_notional: 1000

# ---------------- M4 GUARD 3: DAILY LOSS LIMIT / CIRCUIT BREAKER ------------
# sizing.per_event_cap_usd bounds ONE trade and sizing.max_open_notional bounds
# SIMULTANEOUS exposure, but nothing bounded a BAD DAY. At a $250 clip an
# 85%-win strategy can still string losses. This stops the opening of new
# positions (close_snipe AND settle_sweep) once the day is bad enough, and
# resets automatically at UTC midnight because the daily figure is computed
# from UTC midnight — there is no cron and no state to reset by hand.
#
# CALIBRATED ON THE MEASURED TAPE (236 fills / 121 trading days at shipped
# parameters, audit/M4_risk_guards.md §3):
#   worst single day        -$41.47   days worse than -$50: 0 of 119
#   days worse than -$25:  2 of 119 (1.7%)
#   longest losing streak:  3 trades (once); every other streak was 1
# So $100/day and 4-in-a-row would NEVER have fired on the observed tape: this
# is a breaker for genuine breakage (wrong feed, wrong side, regime change),
# not a variance throttle. One max-clip loss (~-$250) trips it immediately,
# which is intended — that has never happened at these parameters.
#
# RE-DERIVE THESE WHEN MORE COINS GO LIVE. They are calibrated for ~2 trades/day
# on one coin; at ~6 coins the daily loss distribution widens by roughly sqrt(6).
risk:
  daily_loss_limit:
    enabled: true
    bankroll_usd: 1250        # the bot's true exposure ceiling: max_open_notional ($1000)
                              # + per_event_cap_usd ($250), because the global cap is
                              # evaluated BEFORE the new trade is sized.
    max_daily_loss_pct: 8.0   # -> $100/day. 2.4x the worst day ever observed.
    max_daily_loss_usd: null  # optional absolute limit; when BOTH are set the TIGHTER
                              # (smaller) one wins — combining two safety limits the
                              # unsafe way is how guards get quietly widened.
  consecutive_loss_brake:
    enabled: true
    max_consecutive_losses: 4 # max observed streak was 3, so this never false-trips on
                              # the measured tape but catches a systematic break (e.g.
                              # buying the wrong side) after 4 rather than after a day.
                              # Counted per RESOLVED MARKET, not per fill row, and scoped
                              # to the current UTC day.
  log_every_secs: 60          # rate limit for the "breaker tripped" ERROR line
  # Manual override: `python -m polybot.main resume`. It is deliberately NOT an
  # off switch — it is scoped to one UTC day AND records the loss level at which
  # it was granted, so the breaker re-arms if the day loses another full limit
  # or a new losing streak forms. `python -m polybot.main halt` cancels it.
  override_path: "bot/data/risk_override.json"

execution:
  latency_ms: 1500            # simulated reaction latency before re-fetching the book to fill against
  order_book_poll_secs: 1.0   # REST /book poll interval when WSS is not used
  use_websocket: false        # off by default; REST polling is the default, verified path
  max_walk_above_best: 0.03   # never chase ask levels more than this above the best ask —
                              # the research validated top-of-book fills only (first live paper
                              # loss came partly from walking 10c+ deep on a saturated fair)

resolution:
  gamma_poll_secs: 15         # how often to poll gamma for closed/resolved status on open positions
  resolution_timeout_mins: 30 # if gamma hasn't resolved within this window, fall back to oracle winner

discovery:
  poll_secs: 30                # how often to re-scan gamma for new/expiring markets
  hourly_lookahead_hours: 3    # also probe direct slugs for the next N ET hours
  events_limit: 200
  markets_limit: 1000

logging:
  level: INFO
  file: "bot/data/polybot.log"
  max_bytes: 10485760
  backup_count: 5

status:
  write_interval_secs: 3
  http_port_env: "POLYBOT_PORT"   # default 8899, see status_server.py
  http_port_default: 8899
  recent_events_keep: 200

storage:
  sqlite_path: "bot/data/polybot.db"
  fills_csv: "bot/data/fills.csv"
  pnl_csv: "bot/data/pnl.csv"
